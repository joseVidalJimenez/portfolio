<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <marker id="arrowSolid" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" rx="10" />
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">RC Vehicle Control System</text>
  
  <!-- Blocks -->
  <!-- Transmitter -->
  <rect x="50" y="200" width="140" height="60" rx="10" fill="#4A90E2" stroke="#2E73B8" stroke-width="2" />
  <text x="120" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Transmitter</text>
  
  <!-- Receiver -->
  <rect x="250" y="280" width="140" height="60" rx="10" fill="#7ED321" stroke="#5DA81A" stroke-width="2" />
  <text x="320" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Receiver</text>
  
  <!-- ESC -->
  <rect x="430" y="200" width="140" height="60" rx="10" fill="#9013FE" stroke="#7B1FA2" stroke-width="2" />
  <text x="500" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">ESC</text>
  
  <!-- Drive Motors -->
  <rect x="650" y="200" width="140" height="60" rx="10" fill="#41B883" stroke="#2E8B66" stroke-width="2" />
  <text x="720" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Drive</text>
  <text x="720" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Motors</text>
  
  <!-- Batteries -->
  <rect x="430" y="350" width="140" height="60" rx="10" fill="#F5A623" stroke="#D4891C" stroke-width="2" />
  <text x="500" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Batteries</text>
  
  <!-- Servo -->
  <rect x="650" y="350" width="140" height="60" rx="10" fill="#F8E71C" stroke="#D4C518" stroke-width="2" />
  <text x="720" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Servo</text>
  
  <!-- Connections -->
  
  <!-- Transmitter → Receiver (Radio Link) -->
  <line x1="190" y1="240" x2="270" y2="285" stroke="#666" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowDashed)" />
  <text x="210" y="255" font-family="Arial, sans-serif" font-size="12" fill="#666">Radio Link</text>
  
  <!-- Receiver → ESC (Throttle Signal) -->
  <line x1="390" y1="295" x2="455" y2="250" stroke="#666" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowDashed)" />
  <text x="395" y="268" font-family="Arial, sans-serif" font-size="12" fill="#666">Throttle</text>
  <text x="395" y="282" font-family="Arial, sans-serif" font-size="12" fill="#666">Signal</text>
  
  <!-- Receiver → Servo (Steering Signal) -->
  <line x1="390" y1="325" x2="665" y2="365" stroke="#666" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowDashed)" />
  <text x="520" y="340" font-family="Arial, sans-serif" font-size="12" fill="#666">Steering</text>
  <text x="520" y="354" font-family="Arial, sans-serif" font-size="12" fill="#666">Signal</text>
  
  <!-- Batteries → ESC (Power) -->
  <line x1="500" y1="350" x2="500" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrowSolid)" />
  <text x="510" y="310" font-family="Arial, sans-serif" font-size="12" fill="#333">Power</text>
  
  <!-- ESC → Drive Motors (Power) -->
  <line x1="570" y1="230" x2="650" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowSolid)" />
  <text x="600" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Power</text>
  
</svg>