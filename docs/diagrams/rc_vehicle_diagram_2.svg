<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    RC Vehicle Control System
  </text>
  
  <!-- Main signal path (top row) -->
  <!-- Transmitter -->
  <rect x="50" y="150" width="140" height="60" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="120" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Transmitter
  </text>
  
  <!-- Receiver -->
  <rect x="280" y="150" width="140" height="60" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="350" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Receiver
  </text>
  
  <!-- ESC -->
  <rect x="510" y="150" width="140" height="60" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="580" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    ESC
  </text>
  
  <!-- Drive Motors -->
  <rect x="740" y="150" width="140" height="60" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="810" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Drive Motors
  </text>
  
  <!-- Servo (above receiver) -->
  <rect x="280" y="35" width="140" height="60" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="350" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Servo
  </text>
  
  <!-- Batteries (below ESC) -->
  <rect x="510" y="280" width="140" height="60" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="580" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Batteries
  </text>
  
  <!-- Radio Link (dashed line) -->
  <line x1="190" y1="185" x2="280" y2="185" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="235" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
    Radio Link
  </text>
  
  <!-- Throttle Signal -->
  <line x1="420" y1="185" x2="510" y2="185" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="465" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
    Throttle
  </text>
  <text x="465" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
    Signal
  </text>
  
  <!-- Motor Output -->
  <line x1="650" y1="185" x2="740" y2="185" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="695" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
    Motor
  </text>
  <text x="695" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
    Output
  </text>
  
  <!-- Signal + Power from Receiver to Servo -->
  <line x1="350" y1="150" x2="350" y2="95" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="370" y="122.5" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
    signal+power
  </text>
  
  <!-- Power from Batteries to ESC -->
  <line x1="580" y1="280" x2="580" y2="210" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="620" y="235" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
    Main
  </text>
  <text x="620" y="248" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
    Power
  </text>

  <!-- Power from Batteries to Receiver (direct) -->
  <path d="M545 280 L545 240 L350 240 L350 210" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
</svg>