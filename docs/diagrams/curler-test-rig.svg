<svg xmlns="http://www.w3.org/2000/svg" width="900" height="448" viewBox="1 1 223 110">

  <title>Raspberry Pi Motor Control System</title>

  <defs>
    <style>
      :root {
        /* Purple — controller / PWM */
        --purple-fill:   #eeedfe;
        --purple-stroke: #7f77dd;
        --purple-label:  #26215c;
        --purple-sub:    #534ab7;

        /* Teal — motor driver / DC motor */
        --teal-fill:   #e1f5ee;
        --teal-stroke: #0f6e56;
        --teal-label:  #04342c;
        --teal-sub:    #085041;

        /* Amber — GPIO debouncer */
        --amber-fill:   #faeeda;
        --amber-stroke: #ba7517;
        --amber-label:  #412402;
        --amber-sub:    #854f0b;

        /* Coral — limit switch / Scotch Yoke */
        --coral-fill:   #faece7;
        --coral-stroke: #993c1d;
        --coral-label:  #4a1b0c;
        --coral-sub:    #712b13;

        /* Blue — Python data logger */
        --blue-fill:   #e6f1fb;
        --blue-stroke: #185fa5;
        --blue-label:  #042c53;
        --blue-sub:    #0c447c;

        /* Raspberry Pi container */
        --rpi-bg:       #f7f5ff;
        --rpi-hdr:      #534ab7;
        --rpi-hdr-text: #ffffff;
        --rpi-border:   #7f77dd;
      }

      text { font-family: sans-serif; }
      .title { font-size: 3.8px; font-weight: 700; }
      .sub   { font-size: 2.9px; font-weight: 400; }
      .hdr   { font-size: 3.4px; font-weight: 700;
               font-family: monospace; letter-spacing: 0.35px; }
      .tag   { font-size: 2.6px; font-style: italic; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 2 L9 5 L1 8" fill="none" stroke="#444"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer container -->
  <rect x="1" y="1" width="223" height="110" rx="5"
        fill="var(--rpi-bg)" stroke="var(--rpi-border)" stroke-width="1.3"/>

  <!-- Header band -->
  <rect x="1" y="1" width="223" height="11" rx="5"
        fill="var(--rpi-hdr)" stroke="none"/>
  <rect x="1" y="7" width="223" height="5"
        fill="var(--rpi-hdr)" stroke="none"/>

  <text x="112" y="7.5"
        class="hdr" text-anchor="middle" dominant-baseline="central"
        fill="var(--rpi-hdr-text)">
    RASPBERRY PI — CONTROLLER
  </text>

  <!-- ROW 1 — Control path -->
  <text x="9" y="17.5" class="tag" fill="var(--purple-sub)">control path →</text>

  <!-- PWM Output -->
  <rect x="8" y="19" width="56" height="14" rx="3"
        fill="var(--purple-fill)" stroke="var(--purple-stroke)" stroke-width="0.6"/>
  <text x="36" y="25" class="title" text-anchor="middle" dominant-baseline="central"
        fill="var(--purple-label)">PWM output</text>
  <text x="36" y="31" class="sub" text-anchor="middle" dominant-baseline="central"
        fill="var(--purple-sub)">GPIO pulse-width signal</text>

  <!-- Motor Driver -->
  <rect x="72" y="19" width="56" height="14" rx="3"
        fill="var(--teal-fill)" stroke="var(--teal-stroke)" stroke-width="0.6"/>
  <text x="100" y="25" class="title" text-anchor="middle" dominant-baseline="central"
        fill="var(--teal-label)">Motor driver</text>
  <text x="100" y="31" class="sub" text-anchor="middle" dominant-baseline="central"
        fill="var(--teal-sub)">H-bridge circuit</text>

  <!-- DC Motor -->
  <rect x="136" y="19" width="80" height="14" rx="3"
        fill="var(--teal-fill)" stroke="var(--teal-stroke)" stroke-width="0.6"/>
  <text x="176" y="25" class="title" text-anchor="middle" dominant-baseline="central"
        fill="var(--teal-label)">DC motor</text>
  <text x="176" y="31" class="sub" text-anchor="middle" dominant-baseline="central"
        fill="var(--teal-sub)">rotary actuation</text>

  <!-- Row-1 horizontal arrows -->
  <line x1="64" y1="26" x2="72" y2="26"
        stroke="var(--purple-stroke)" stroke-width="0.7" fill="none"
        marker-end="url(#arrow)"/>
  <line x1="128" y1="26" x2="136" y2="26"
        stroke="var(--teal-stroke)" stroke-width="0.7" fill="none"
        marker-end="url(#arrow)"/>

  <!-- Vertical connectors -->
  <line x1="176" y1="33" x2="176" y2="55"
        stroke="var(--teal-stroke)" stroke-width="0.7" fill="none"
        marker-end="url(#arrow)"/>
  <line x1="36" y1="55" x2="36" y2="33"
        stroke="var(--amber-stroke)" stroke-width="0.7" fill="none"
        marker-end="url(#arrow)"/>

  <!-- ROW 2 — Feedback path -->
  <text x="9" y="53.5" class="tag" fill="var(--coral-sub)">← feedback path</text>

  <!-- GPIO Debouncer -->
  <rect x="8" y="55" width="56" height="14" rx="3"
        fill="var(--amber-fill)" stroke="var(--amber-stroke)" stroke-width="0.6"/>
  <text x="36" y="61" class="title" text-anchor="middle" dominant-baseline="central"
        fill="var(--amber-label)">GPIO debouncer</text>
  <text x="36" y="67" class="sub" text-anchor="middle" dominant-baseline="central"
        fill="var(--amber-sub)">cleans switch signal</text>

  <!-- Limit Switch -->
  <rect x="72" y="55" width="56" height="14" rx="3"
        fill="var(--coral-fill)" stroke="var(--coral-stroke)" stroke-width="0.6"/>
  <text x="100" y="61" class="title" text-anchor="middle" dominant-baseline="central"
        fill="var(--coral-label)">Limit switch</text>
  <text x="100" y="67" class="sub" text-anchor="middle" dominant-baseline="central"
        fill="var(--coral-sub)">position detection</text>

  <!-- Scotch Yoke -->
  <rect x="136" y="55" width="80" height="14" rx="3"
        fill="var(--coral-fill)" stroke="var(--coral-stroke)" stroke-width="0.6"/>
  <text x="176" y="61" class="title" text-anchor="middle" dominant-baseline="central"
        fill="var(--coral-label)">Scotch Yoke mech.</text>
  <text x="176" y="67" class="sub" text-anchor="middle" dominant-baseline="central"
        fill="var(--coral-sub)">rotary → linear actuation</text>

  <!-- Row-2 horizontal arrows -->
  <line x1="136" y1="62" x2="128" y2="62"
        stroke="var(--coral-stroke)" stroke-width="0.7" fill="none"
        marker-end="url(#arrow)"/>
  <line x1="72" y1="62" x2="64" y2="62"
        stroke="var(--amber-stroke)" stroke-width="0.7" fill="none"
        marker-end="url(#arrow)"/>

  <!-- ROW 3 — Python Data Logger -->
  <line x1="8" y1="82" x2="216" y2="82"
        stroke="var(--blue-stroke)" stroke-width="0.25"
        stroke-dasharray="2 2.5" opacity="0.55"/>
  <rect x="8" y="84" width="208" height="22" rx="3"
        fill="var(--blue-fill)" stroke="var(--blue-stroke)" stroke-width="0.6"/>
  <text x="112" y="91" class="title" text-anchor="middle" dominant-baseline="central"
        fill="var(--blue-label)">Python data logger</text>
  <text x="112" y="99" class="sub" text-anchor="middle" dominant-baseline="central"
        fill="var(--blue-sub)">Cycle count  &#xB7;  Timestamp  &#xB7;  Resistance R(&#x3A9;)</text>

  <!-- GPIO Debouncer to Data Logger -->
  <line x1="36" y1="69" x2="36" y2="84"
        stroke="var(--blue-stroke)" stroke-width="0.7" fill="none"
        marker-end="url(#arrow)"/>

</svg>
