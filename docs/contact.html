		<meta name="description" content="Contact José Vidal, design engineer based in London.">
		<link rel="stylesheet" href="css/styles.css">
	</head>
	<body>
		<div class="navbar">
			<div class="navbar-layout">
			  <div class="navbar-icon">
				<img src="images/favicon_brand.png" alt="Logo." width="20px" height="20px" loading="eager">
			  </div>
			  <div class="navbar-name">
				<a>Jose Vidal</a>
			  </div>
			  <div class="navbar-menu">
				<a href="index.html">Home</a>

			  </div>
			</div>
		</div>

		<div class="container">
			<form id="contactForm">

				<!-- Web3Forms access key - does not expose your email -->
				<input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
				<input type="hidden" name="subject" value="New message from Portfolio Contact Page">
				<input type="hidden" name="from_name" value="Jose Vidal Portfolio">
				<!-- Honeypot spam protection -->
				<input type="checkbox" name="botcheck" style="display:none">
		  
				<label for="name">Name</label>
				<input type="text" id="name" placeholder="Your name.." name="name" required>

				<label for="email">Email:</label>
				<input type="email" id="email" placeholder="Your email.." name="email" required>

				<label for="message">Message</label>
				<textarea id="message" name="message" placeholder="Tell me all abouit it.." style="height:200px"></textarea>

				<input type="submit" value="Submit">
		  
			</form>
		</div>
		  
		<script src="./scripts/contact.js"></script>
		  

		<div class="footer">
			<div class="footer-layout">
				<div class="footer-text">
					<p>&copy;Jose Vidal</p>

				</div>
			</div>
		</div>
	</body>
